name: CI

on:
  push:
    branches: [main]
  pull_request:

# Die Pipeline prüft, sie veröffentlicht nichts. Mehr Rechte braucht sie nicht.
permissions:
  contents: read

# Ein zweiter Push auf denselben Zweig bricht den ersten Lauf ab, statt beide
# zu bezahlen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Zwei Jobs, bewusst getrennt: Die Gates brauchen keine Abhängigkeiten und sind
# in Sekunden durch. Wer eine Zeilennummer in der Anforderungsmappe verschoben
# hat, sieht das, ohne auf npm ci zu warten.

jobs:
  gates:
    name: Zusagen des Repos
    runs-on: ubuntu-latest
    # Drei Behauptungen, die dieses Repo über sich selbst macht — die
    # Architekturtrennung, die Belege in der Anforderungsmappe, die Verweise
    # zwischen den Dokumenten. Ohne diese Gates stehen sie nur in Prosa da.
    # Erklärt in docs/PIPELINE.md.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Die drei bleiben getrennte Schritte, damit im roten Lauf ohne Logsuche
      # sichtbar ist, welches der Gates hing.
      - name: Entkopplung prüfen
        run: bash scripts/entkopplung-check.sh
      - name: Belege prüfen
        run: bash scripts/beleg-check.sh
      - name: Verweise prüfen
        run: node scripts/link-check.mjs

  typen:
    name: Typen und Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Abhängigkeiten
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # ESLint bleibt auf der 9er-Linie, Begründung in eslint.config.mjs.
      - name: Lint
        run: npm run lint

  bau:
    name: Build und Seitenbudget
    runs-on: ubuntu-latest
    # Baut die Seite gegen die Fixtures aus src/lib/storyblok/fixtures/ und
    # misst danach, was ein Browser pro Seite laedt. Ohne diesen Job stuende
    # "performant" in docs/ANFORDERUNGEN.md ohne eine einzige Zahl daneben.
    #
    # Warum Fixtures und nicht der echte Space: next build ruft beim Sammeln
    # der Seitendaten die Storyblok-API. Ein Job, der auf ein Secret wartet,
    # das noch niemand hinterlegt hat, laeuft nie — und prueft entsprechend nie.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Abhängigkeiten
        run: npm ci
      - name: Build gegen Fixtures
        run: npm run build:fixtures
      - name: Seitenbudget prüfen
        run: node scripts/budget-check.mjs

  # --- Sobald die Token als Secrets hinterlegt sind ------------------------
  # Der Build oben laeuft gegen Fixtures. Er beweist, dass die Seite baut und
  # wie schwer sie ist — nicht, dass der Abruf gegen den echten Space
  # funktioniert. Dafuer braucht es einen Lesetoken unter Settings -> Secrets;
  # dann kommt hier ein zweiter Build ohne BLOKWERK_FIXTURES dazu:
  #
  # build-echt:
  #   name: Build gegen echte Inhalte
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: '24'
  #         cache: npm
  #     - run: npm ci
  #     - run: npm run build
  #       env:
  #         STORYBLOK_PUBLIC_TOKEN: ${{ secrets.STORYBLOK_PUBLIC_TOKEN }}
  #
  # Ebenfalls offen, sobald ein Deployment existiert: ein Lighthouse-Lauf. Das
  # Seitenbudget misst Gewicht, nicht Geschwindigkeit — es sagt nichts ueber
  # Latenz, Caching oder Largest Contentful Paint.
